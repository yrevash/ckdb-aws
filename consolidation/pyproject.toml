[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "postmortem-consolidation"
version = "0.1.0"
description = "Windowed sleep-time consolidation for Postmortem agent memory"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
aws = [
  "boto3>=1.40,<2",
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["postmortem_consolidation*"]

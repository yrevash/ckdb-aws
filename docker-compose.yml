services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.0
    command:
      - start-single-node
      - --insecure
      - --advertise-addr=cockroach
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - cockroach
        - sql
        - --insecure
        - --host=cockroach
        - --execute=SELECT 1
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - cockroach-data:/cockroach/cockroach-data

  db-migrate:
    image: cockroachdb/cockroach:v26.2.0
    depends_on:
      cockroach:
        condition: service_healthy
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/db/apply.sh"]
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      # audit B3 -- local root cluster: a refused SET CLUSTER SETTING is a real
      # defect here, so keep the schema apply fail-closed. Only a managed
      # CockroachDB Cloud tier that withholds MODIFYCLUSTERSETTING should run
      # with 0 (db/apply.sh then names each lost capability instead of aborting).
      POSTMORTEM_BOOTSTRAP_STRICT: "1"
    volumes:
      - ./:/workspace:ro

volumes:
  cockroach-data:
